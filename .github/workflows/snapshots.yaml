name: Coletor de snapshots por instituição

# Guarda uma "foto" dos totais por instituição uma vez por mês.
# O front compara a foto anterior com a posterior de cada carga registrada pelo
# ETL, o que permite dizer quanto cada instituição ganhou ou perdeu.
#
# Cadência mensal: as cargas do ETL são mensais e a comparação é feita entre
# fotos, então uma foto por mês é o suficiente. O custo é que o par de fotos
# pode estar mais afastado da janela da carga — a tabela marca essas linhas
# como "fotos mensais" em vez de atribuir a diferença a uma carga só.
#
# As fotos ficam no branch `dados-snapshots` (não afeta o build do site) e são
# lidas pelo front via raw.githubusercontent.com. Para trocar de destino, mude
# `VITE_SNAPSHOTS_URL` no ambiente de build.

on:
  schedule:
    # todo dia 1º às 04:07 UTC (01:07 em America/Bahia)
    - cron: '7 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coletor-snapshots
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o branch de dados
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dados"
          cd "$RUNNER_TEMP/dados"
          git init -q
          git config user.name "coletor-consistencia"
          git config user.email "coletor@observatorio.secti.ba.gov.br"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin dados-snapshots; then
            git reset -q --hard FETCH_HEAD
          fi

      - name: Coletar a foto do momento
        env:
          ETL_API_KEY: ${{ secrets.ETL_API_KEY }}
        run: node scripts/coletor-snapshots.mjs --saida "$RUNNER_TEMP/dados"

      - name: Publicar no branch de dados
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dados"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou desde a última coleta."
            exit 0
          fi
          git commit -q -m "dados: snapshot $(date -u +%FT%TZ)"
          git push -q origin HEAD:dados-snapshots
