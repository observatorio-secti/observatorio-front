name: CI/CD Pipeline - Observatorio Front

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_DNS }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/observatorio/observatorio-front

            # Restaura os arquivos rastreados. O `git pull` não reescreve arquivos
            # que não mudaram no commit, então um checkout interrompido (disco cheio,
            # por exemplo) deixava imagens vazias/truncadas para sempre no servidor.
            git fetch origin main
            git reset --hard origin/main

            # Aborta antes de buildar se algum asset binário veio vazio no checkout.
            for asset in public/LOGO.png public/GOVERNO-BAHIA-SECTI.png public/LOGO-LICURI.jpeg public/BG-OBSERVATORIO.png; do
              if [ ! -s "$asset" ]; then
                echo "ERRO: $asset está vazio no servidor (checkout corrompido)." >&2
                exit 1
              fi
            done

            # Build da imagem
            docker build -t observatorio-front:latest .

            # Extrai o dist sem erro de permissão (container temporário + docker cp).
            # Copia o CONTEÚDO (/app/dist/.) para um diretório novo e só então troca
            # o dist publicado: evita o docker cp aninhar em ./dist/dist e garante
            # permissões de leitura para o nginx.
            CONTAINER_ID=$(docker create observatorio-front:latest)
            rm -rf ./dist.next
            mkdir -p ./dist.next
            docker cp "$CONTAINER_ID:/app/dist/." ./dist.next/
            docker rm "$CONTAINER_ID"
            chmod -R a+rX ./dist.next

            if [ ! -s ./dist.next/index.html ]; then
              echo "ERRO: index.html não foi copiado para o dist." >&2
              exit 1
            fi

            OLD_DIST="./dist.old.$$"
            if [ -e ./dist ]; then mv ./dist "$OLD_DIST"; fi
            mv ./dist.next ./dist
            rm -rf "$OLD_DIST" 2>/dev/null || true

            # Confere que o dist publicado tem o HTML e as imagens.
            for asset in dist/index.html dist/LOGO.png dist/GOVERNO-BAHIA-SECTI.png dist/LOGO-LICURI.jpeg; do
              if [ ! -s "$asset" ]; then
                echo "ERRO: $asset saiu vazio no build." >&2
                exit 1
              fi
            done

            echo "Deploy concluído em $(date -u +%FT%TZ)."
